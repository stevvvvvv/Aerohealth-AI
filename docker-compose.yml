services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aerohealth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aerohealth}
      POSTGRES_DB: aerohealth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerohealth"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aerohealth:${POSTGRES_PASSWORD:-aerohealth}@db:5432/aerohealth
    volumes:
      - cmapss:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  cmapss:
